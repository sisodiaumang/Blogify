name: Automated Hourly News Publishing

on:
  schedule:
    # Runs every hour at the top of the hour (e.g. 1:00, 2:00, 3:00)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Live News Endpoint
        run: |
          echo "Triggering hourly news automation endpoint on Vercel..."
          curl -s -X GET "https://blogify-for-stories.vercel.app/api/cron/fetch-news"
